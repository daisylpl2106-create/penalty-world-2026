<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Penalty World PRO</title>
<style>
body {
  margin:0;
  background: linear-gradient(#0b6623,#063d14);
  color:white;
  font-family:Arial;
  text-align:center;
}

h1 { margin-top:20px; }

.goal {
  width:400px;
  height:200px;
  border:5px solid white;
  margin:30px auto;
  position:relative;
  overflow:hidden;
}

.keeper {
  position:absolute;
  bottom:0;
  left:170px;
  font-size:50px;
  transition: all 0.4s ease;
}

.ball {
  position:absolute;
  bottom:10px;
  left:190px;
  font-size:25px;
  transition: all 0.5s ease;
}

button {
  padding:12px;
  margin:10px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:8px;
}

#result {
  font-size:24px;
  margin-top:10px;
}
</style>
</head>

<body>

<h1>🏆 Penalty World PRO</h1>

<div class="goal">
  <div id="keeper" class="keeper">🧍‍♂️</div>
  <div id="ball" class="ball">⚽</div>
</div>

<h2 id="result">Dispara</h2>

<button onclick="shoot('left')">⬅️</button>
<button onclick="shoot('center')">⬆️</button>
<button onclick="shoot('right')">➡️</button>

<h3 id="score">0 / 5</h3>

<script>
let goals = 0;
let shots = 0;

function shoot(dir){
  const keeper = ["left","center","right"][Math.floor(Math.random()*3)];

  const ball = document.getElementById("ball");
  const k = document.getElementById("keeper");

  // reset posiciones
  ball.style.bottom = "10px";
  ball.style.left = "190px";

  setTimeout(()=>{

    // movimiento balón
    if(dir==="left"){
      ball.style.left="40px";
      ball.style.bottom="150px";
    }
    if(dir==="center"){
      ball.style.left="190px";
      ball.style.bottom="160px";
    }
    if(dir==="right"){
      ball.style.left="340px";
      ball.style.bottom="150px";
    }

    // movimiento portero
    if(keeper==="left") k.style.left="20px";
    if(keeper==="center") k.style.left="170px";
    if(keeper==="right") k.style.left="320px";

    setTimeout(()=>{
      if(dir===keeper){
        document.getElementById("result").innerText="❌ ATAJADA";
      } else {
        document.getElementById("result").innerText="⚽ GOOOOOL";
        goals++;
      }

      shots++;
      document.getElementById("score").innerText = goals+" / 5";

      if(shots===5){
        setTimeout(()=>{
          alert("Partido terminado: "+goals+" goles");
          goals=0;
          shots=0;
        },500);
      }

    },400);

  },100);
}
</script>

</body>
</html>
